name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host

    defaults:
      run:
        working-directory: automation

    env:
      CI: 'true'
      UI_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false

      - name: Check out Stockroom application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Lorena144/stockroom-application
          ref: 7ed436fbf902c85a97ed61c6a655b11c4a811ad5
          path: application
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            automation/package-lock.json
            application/package-lock.json

      - name: Install automation dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Install application dependencies
        working-directory: application
        run: npm ci

      - name: Create CI demo accounts
        working-directory: application
        env:
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
        run: npm run setup

      - name: Build application
        working-directory: application
        run: npm run build

      - name: Run UI, API and hybrid tests
        env:
          CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
          STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
        run: npm test

      - name: Generate Allure report
        if: github.ref == 'refs/heads/main'
        run: npm run allure:generate

      - name: Upload Allure report for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: automation/allure-report

  deploy:
    needs: playwright
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency: github-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure report
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1            